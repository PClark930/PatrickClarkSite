name: Build and Deploy

# Hosted on the developer's nfoservers hosting, same setup as The Cafe's and
# Legacy's sites: build with Eleventy, upload _site/ over FTP.
#
# NOT LIVE YET. Until Patrick has something worth publishing, this only runs
# by hand (Actions tab -> Build and Deploy -> Run workflow). To go live, the
# FTP_* secrets must be set on the repo (Settings -> Secrets and variables ->
# Actions), then uncomment the `push` trigger below. Leave that to Mitch.
#
# Work happens on `dev`; merging into `main` deploys (once `push` is on).
on:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - 'README.md'
  #     - 'CLAUDE.md'
  #     - '.claude/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Also checks resume.json and scans the finished pages for phone
      # numbers, stray emails and local paths. Nothing uploads if it fails.
      - name: Build and check
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./_site/
