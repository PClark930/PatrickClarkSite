name: Build and Deploy

# Hosted on Mitch's nfoservers hosting, same setup as The Cafe's and Legacy's
# sites: build with Eleventy, upload _site/ over FTP (the FTP_* secrets on the
# repo). Work happens on `dev`; merging into `main` deploys. It can also be run
# by hand: Actions tab -> Build and Deploy -> Run workflow. Changes to this
# file are Mitch's.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - '.claude/**'
  workflow_dispatch:

# One deploy at a time; a running upload is never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Also checks resume.json and scans the finished pages for phone
      # numbers, stray emails and local paths. Nothing uploads if it fails.
      - name: Build and check
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./_site/

      # A mistake in .htaccess takes the whole site down, so look at the live
      # site right after uploading. A red X here means check it now.
      - name: Check the live site
        run: |
          url=$(node -p "require('./src/_data/site.json').url")
          fail=0
          expect() {
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2")
            if [ "$got" = "$1" ]; then echo "ok    $got  $2"; else echo "FAIL  $got  $2 (expected $1)"; fail=1; fi
          }
          expect 200 "$url/"
          expect 200 "$url/resume/"
          expect 200 "$url/$(node -p "require('./scripts/versions.js').loadVersions()[0].file").pdf"
          expect 301 "${url/https:\/\//https://www.}/"
          expect 404 "$url/.ftp-deploy-sync-state.json"
          exit $fail
