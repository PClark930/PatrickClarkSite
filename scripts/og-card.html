<!DOCTYPE html>
<!--
  Source for src/assets/img/og-card.png: the picture shown when someone shares a
  link to the site (texts, chats, LinkedIn). It isn't part of the site itself.
  To remake it after a change, from the repo folder:
    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars
      --window-size=1200,630 --screenshot=src\assets\img\og-card.png scripts\og-card.html
  Keep the words in step with resume.json (name, headline, location).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    padding: 0 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background-color: #2b3035;
    background-image: radial-gradient(rgba(255, 255, 255, .08) 1.5px, transparent 1.8px);
    background-size: 26px 26px;
    border-bottom: 16px solid #2f6690;
    color: #ffffff;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  .bar { width: 88px; height: 8px; border-radius: 4px; background: #2f6690; margin-bottom: 40px; }
  h1 { margin: 0 0 20px; font-size: 112px; line-height: 1; letter-spacing: -3px; font-weight: 700; }
  .headline { margin: 0 0 44px; font-size: 40px; line-height: 1.3; font-weight: 600; color: #a9cbe6; }
  .meta { margin: 0; font-size: 30px; color: #c9cdd2; }
</style>
</head>
<body>
  <div class="bar"></div>
  <h1>Patrick Clark</h1>
  <p class="headline">Army Reserve Captain<br>Operations, Logistics &amp; Program Management</p>
  <p class="meta">Leavenworth, KS · patrickclark.cv</p>
</body>
</html>
